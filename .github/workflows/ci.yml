name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wte
          POSTGRES_PASSWORD: wte
          POSTGRES_DB: what_to_eat_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wte" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://wte:wte@localhost:5432/what_to_eat_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
